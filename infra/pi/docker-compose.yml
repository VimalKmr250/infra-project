# QA environment - Raspberry Pi 5 (linux/arm64).
#
# The Pi never accepts inbound connections. It pulls its image from GHCR and
# reaches the internet outbound through a Cloudflare tunnel, so no router port
# is forwarded and no firewall rule is needed.
#
# Two tunnel options, selected by profile:
#   quick  - free, no domain, URL changes on every restart  (default here)
#   named  - stable hostname, requires a domain on Cloudflare and a tunnel token
# deploy.sh picks the profile based on whether CLOUDFLARE_TUNNEL_TOKEN is set.
#
# Memory limits below are sized for an 8GB Pi 5 and are NOT optional. Without a
# container limit the JVM reads the host's total RAM and sizes its heap from
# that - on an 8GB Pi it would reserve roughly 6GB and starve Postgres.
# On a 4GB Pi use api 768m / db 640m / MaxRAMPercentage=55.

name: vksiv-apps-qa

services:
  api:
    image: ${IMAGE:?set IMAGE in .env, e.g. ghcr.io/OWNER/REPO:qa}
    container_name: vksiv-api
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      SPRING_PROFILES_ACTIVE: qa
      DB_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env}
      # 60% of the 1g limit leaves headroom for metaspace, thread stacks and
      # direct buffers, which live outside the heap and are easy to forget.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC"
    ports:
      # Bound to loopback: reachable by cloudflared and from the Pi itself,
      # but not from the rest of the LAN.
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:17-alpine
    container_name: vksiv-db
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Postgres ships with defaults tuned for a much smaller machine than it
    # assumes. max_connections is 20 because the app's pool maxes out at 5.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=20
      - -c
      - random_page_cost=1.1
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    container_name: vksiv-tunnel
    profiles: ["quick"]
    restart: unless-stopped
    mem_limit: 128m
    command: tunnel --no-autoupdate --url http://api:8080
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared-named:
    image: cloudflare/cloudflared:latest
    container_name: vksiv-tunnel
    profiles: ["named"]
    restart: unless-stopped
    mem_limit: 128m
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db-data:
