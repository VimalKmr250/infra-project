# QA environment - Raspberry Pi 4 Model B, 4GB, 64-bit Raspberry Pi OS (arm64).
#
# The Pi never accepts inbound connections. It pulls its image from GHCR and
# reaches the internet outbound through a Cloudflare tunnel, so no router port
# is forwarded and no firewall rule is needed.
#
# Two tunnel options, selected by profile:
#   quick  - free, no domain, URL changes on every restart  (default here)
#   named  - stable hostname, requires a domain on Cloudflare and a tunnel token
# deploy.sh picks the profile based on whether CLOUDFLARE_TUNNEL_TOKEN is set.
#
# Memory limits are sized for a 4GB board and are NOT optional. Without a
# container limit the JVM reads the host's total RAM and sizes its heap from
# that, which on this board means it would try to reserve ~3GB and leave nothing
# for Postgres. Capped totals here are ~1.5GB, leaving the rest for the OS,
# Docker, and page cache.
#
# On an 8GB board you can raise api to 1g / MaxRAMPercentage=60 and db to 1g /
# shared_buffers=256MB.

name: vksiv-apps-qa

services:
  api:
    image: ${IMAGE:?set IMAGE in .env, e.g. ghcr.io/OWNER/REPO:qa}
    container_name: vksiv-api
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 768m
    environment:
      SPRING_PROFILES_ACTIVE: qa
      DB_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env}
      # 55% of 768m is ~420MB of heap. The remainder is not spare - metaspace,
      # thread stacks and direct buffers all live outside the heap.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=55 -XX:+UseSerialGC"
    ports:
      # Bound to loopback: reachable by cloudflared and from the Pi itself,
      # but not from the rest of the LAN.
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 5
      # A Cortex-A72 booting Spring Boot off a microSD card is slow. 90s is
      # enough on a Pi 5 with NVMe and not enough here.
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:17-alpine
    container_name: vksiv-db
    restart: unless-stopped
    mem_limit: 640m
    memswap_limit: 640m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Tuned for 4GB of RAM on a microSD card. The second half of this list is
    # about writing less, because SD cards wear out by being written to:
    #   synchronous_commit=off  - the big one. Commits stop waiting on fsync.
    #                             A crash can lose the last fraction of a second
    #                             of transactions, which is the right trade for
    #                             QA and the wrong one for production.
    #   wal_compression         - fewer bytes of WAL per write.
    #   checkpoint_timeout      - checkpoints every 15 min instead of every 5.
    # max_connections is 20 because the application pool maxes out at 5.
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=20
      - -c
      - random_page_cost=2.0
      - -c
      - synchronous_commit=off
      - -c
      - wal_compression=on
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=512MB
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    container_name: vksiv-tunnel
    profiles: ["quick"]
    restart: unless-stopped
    mem_limit: 128m
    command: tunnel --no-autoupdate --url http://api:8080
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared-named:
    image: cloudflare/cloudflared:latest
    container_name: vksiv-tunnel
    profiles: ["named"]
    restart: unless-stopped
    mem_limit: 128m
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db-data:
