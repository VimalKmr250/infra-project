# Reference Cloud Run configuration.
#
# The release workflow deploys with gcloud flags rather than applying this file,
# because it needs to substitute a resolved image digest. This exists so the
# intended shape of the service is reviewable in git, and so you can apply it by
# hand when bootstrapping:
#
#   gcloud run services replace infra/cloudrun/service.yaml --region <REGION>
#
# Replace PROJECT_ID, REGION and REPOSITORY before applying.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: vksiv-apps
  labels:
    cloud.googleapis.com/location: REGION
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Scale to zero when idle - this is what keeps the service inside the
        # always-free tier. The cost is a cold start on the first request.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/app:prod
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-database-url
                  key: latest
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-jwt-secret
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
            periodSeconds: 30
