# Local development stack.
#
#   docker compose -f infra/local/docker-compose.yml up -d
#       Postgres only. Run the backend with ./gradlew :backend:bootRun -PskipFrontend
#       and the UI with `npm start` for sub-second reloads. This is the default
#       and the one you want day to day.
#
#   ... --profile tools up -d      adds pgAdmin on http://localhost:5050
#   ... --profile full  up -d      adds the API container, to reproduce the Pi

name: vksiv-apps-local

services:
  db:
    image: postgres:17-alpine
    container_name: vksiv-db-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vksiv-pgadmin-local
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-dev@local.test}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy

  api:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: vksiv-api-local
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: qa
      DB_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-local-development-only-secret-not-for-any-real-use}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
