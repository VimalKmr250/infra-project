spring:
  application:
    name: vksiv-apps
  jpa:
    open-in-view: false
    hibernate:
      # Liquibase owns the schema. Hibernate only checks the mapping matches it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    build:
      enabled: true

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiry: ${APP_JWT_EXPIRY:PT1H}
    refresh-expiry: ${APP_JWT_REFRESH_EXPIRY:P7D}
